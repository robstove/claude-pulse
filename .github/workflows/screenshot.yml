# After a push to main that can change how the pane draws, draw docs/screenshot.png again from the made-up session in
# scripts/screenshot/pane.shot.tsx, and commit it only when the picture changed. The draw job installs npm packages with
# a read-only token; only the commit job, which installs nothing, can write. A push with GITHUB_TOKEN starts no workflow.
name: screenshot

on:
  push:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'types/**'
      - '.claude-plugin/plugin.json'
      - '.claude-code-version'
      - 'tsconfig.json'
      - 'scripts/screenshot.mjs'
      - 'scripts/screenshot/**'
      - '.github/workflows/screenshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot
  cancel-in-progress: true

jobs:
  draw:
    # A pinned image and one named font keep the picture the same from run to run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: 1.49.1
      DISABLE_AUTOUPDATER: 1
      DISABLE_TELEMETRY: 1
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code, Playwright, and the font
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-liberation
          npm install --global "@anthropic-ai/claude-code@$(tr -d '[:space:]' < .claude-code-version)"
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Draw
        run: node scripts/screenshot.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot
          path: docs/screenshot.png
          retention-days: 7

  commit:
    needs: draw
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: screenshot
          path: docs
      - name: Commit when the picture changed
        run: |
          if git diff --quiet -- docs/screenshot.png; then
            echo "The screenshot did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: Draw the README screenshot again" -- docs/screenshot.png
          # Another push can land on main while the job draws; rebase onto it and try once more.
          for attempt in 1 2; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
